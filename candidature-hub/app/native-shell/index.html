<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f2ec" />
    <title>Candidature Hub</title>
    <style>
      :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; }
      body { display: grid; min-height: 100vh; margin: 0; place-items: center; background: #f5f2ec; color: #2c3542; }
      main { max-width: 28rem; padding: 2rem; text-align: center; }
      .mark { display: grid; width: 4rem; height: 4rem; margin: 0 auto 1.5rem; place-items: center; border-radius: 1.2rem; background: linear-gradient(145deg, #71859a, #40536a); box-shadow: 0 12px 30px rgba(67, 93, 117, .2); }
      .mark svg { width: 78%; height: 78%; }
      h1 { margin: 0; font-size: 1.75rem; }
      p { color: #6d737a; line-height: 1.55; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 72 72" fill="none">
          <rect x="10" y="15" width="38" height="46" rx="12" fill="#dfe8ee" opacity=".78" />
          <rect x="21" y="9" width="41" height="48" rx="13" fill="#fffefa" />
          <circle cx="41.5" cy="26" r="7" fill="#61758a" />
          <path d="M30 43.5c2.8-5.2 7-7.8 11.5-7.8s8.7 2.6 11.5 7.8" stroke="#61758a" stroke-width="5" stroke-linecap="round" />
          <circle cx="55" cy="53" r="11" fill="#c9795e" />
          <path d="m50.5 53 3 3 6-7" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </div>
      <h1>Candidature Hub</h1>
      <p>Il server non è raggiungibile. Verifica che Candidature Hub sia in esecuzione e che l’iPad sia collegato alla rete corretta.</p>
    </main>
  </body>
</html>
